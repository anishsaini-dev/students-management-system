<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Student Management System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .stat-card { border-radius: 12px; color: white; padding: 20px; }
        .bg-1 { background: linear-gradient(135deg,#667eea,#764ba2); }
        .bg-2 { background: linear-gradient(135deg,#11998e,#38ef7d); }
        .bg-3 { background: linear-gradient(135deg,#f7971e,#ffd200); }
        .bg-4 { background: linear-gradient(135deg,#eb3349,#f45c43); }
        .table thead { background: #2c3e50; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'student_list' %}">
            🎓 Student Management System
        </a>
        <a href="{% url 'student_create' %}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Add Student
        </a>
    </div>
</nav>

<div class="container">
    {% if messages %}
        {% for msg in messages %}
            <div class="alert alert-{{ msg.tags }} alert-dismissible fade show">
                {{ msg }}
                <button class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
