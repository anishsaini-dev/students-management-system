{% extends 'students/base.html' %}

{% block title %}Delete Student{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <h3 class="text-danger">⚠️ Confirm Delete</h3>
            <p class="mt-3">
                Kya tum sach mein <strong>{{ student.name }}</strong> (Roll: {{ student.roll_no }})
                ko delete karna chahte ho?
            </p>
            <p class="text-muted small">Ye action undo nahi ho sakta.</p>

            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> Yes, Delete
                </button>
                <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
